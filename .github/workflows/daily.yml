name: Daily refresh

on:
  schedule:
    # ~06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Optional: enables the 5th source (Artificial Analysis).
          # Set as a repo secret; the fetcher skips cleanly without it.
          ARTIFICIALANALYSIS_API_KEY: ${{ secrets.ARTIFICIALANALYSIS_API_KEY }}
        run: python metarank/aggregate.py "data-$(date +%F).json"

      - name: Build site
        run: python site/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-*.json docs/
          git diff --cached --quiet || git commit -m "daily refresh $(date +%F)"
          git push
